# nginx для Megabrain2 (https://megabrain.mertas.space).
# Ставить: /etc/nginx/sites-available/megabrain → ln -s в sites-enabled, затем nginx -t && systemctl reload nginx
# HTTPS/redirect-часть дописывает certbot: certbot --nginx -d megabrain.mertas.space --redirect
server {
    server_name megabrain.mertas.space;

    # загрузка вопросов пачкой (express-лимит 5 МБ + запас)
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3042;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # важно для cookie сессии (secure включается только на https)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # WebSocket: без Upgrade-заголовков дуэли не подключатся
    location /pvp-socket {
        proxy_pass http://127.0.0.1:3042;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /blitz-socket {
        proxy_pass http://127.0.0.1:3042;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    listen 80;
}
